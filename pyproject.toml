[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracevla-robotics"
version = "0.1.0"
description = "TRACE-VLA: trace-based rollout correction and process-aware weighting for VLA policy improvement"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Chris Liu"}]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]
robot = ["opencv-python", "pyzmq"]

[tool.setuptools.packages.find]
include = ["tracevla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
