[build-system]
# setuptools>=77 is required for the PEP 639 string form of project.license.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacer-robotics"
version = "0.2.0"
description = "PACER: process-aware correction and evidence reweighting for VLA policy improvement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Chris Liu"}]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]
robot = ["opencv-python", "pyzmq"]

[tool.setuptools]
packages = ["pacer", "pacer.collection", "pacer.rollout_eval", "pacer.weighting", "pacer_framework"]

[tool.setuptools.package-dir]
pacer_framework = "PACER_Framework/pacer_framework"

[project.scripts]
pacer-score = "pacer_framework.scoring:main"
pacer-demo = "pacer_framework.demo:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "PACER_Framework"]
